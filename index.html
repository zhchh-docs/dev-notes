<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>树荫书房 · 教科书级全栈知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D7A4F'/%3E%3Crect x='14' y='16' width='9' height='34' rx='2' fill='%23F2D06B'/%3E%3Crect x='26' y='12' width='11' height='38' rx='2' fill='%23F8FAF0'/%3E%3Crect x='40' y='18' width='9' height='32' rx='2' fill='%23E8A0A8'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F4EFE4; --paper-2:#EFE7D6; --card:#FDFBF5;
  --ink:#2B2A24; --ink-2:#5A564A; --ink-3:#8A8474;
  --line:#E2D9C4; --accent:#3D7A4F; --accent-2:#255A36;
  --wood:#9A6B43; --wood-2:#7C5232; --wood-3:#5E3D22;
  --gold:#C9A227; --shadow:0 2px 10px rgba(60,50,30,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    repeating-linear-gradient(0deg, rgba(120,100,60,.022) 0 2px, transparent 2px 4px),
    linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
  color:var(--ink);line-height:1.7;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
::selection{background:rgba(61,122,79,.22)}

/* ── 顶栏 ── */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(244,239,228,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--accent-2)}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3D7A4F,#255A36);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 10px rgba(37,90,54,.3)}
.brand small{font-weight:500;font-size:12px;color:var(--ink-3);margin-left:2px}
.topbar .sp{flex:1}
.tb-btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 14px;transition:.15s;
}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tb-btn .kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--paper)}

/* ── 主体 ── */
main{max-width:1080px;margin:0 auto;padding:34px 20px 70px}

/* Hero */
.hero{text-align:center;padding:26px 0 8px}
.hero .badge{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--accent-2);
  background:rgba(61,122,79,.09);border:1px solid rgba(61,122,79,.22);
  padding:5px 15px;border-radius:999px;margin-bottom:16px;
}
.hero h1{font-size:34px;font-weight:900;letter-spacing:.01em;color:var(--ink);line-height:1.3}
.hero h1 em{font-style:normal;color:var(--accent);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:8px;background:rgba(201,162,39,.28);z-index:-1;border-radius:3px}
.hero .sub{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.hero .stats{
  display:inline-flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
  margin:20px auto 0;font-size:13.5px;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 26px;box-shadow:var(--shadow);
}
.hero .stats b{color:var(--accent-2);font-size:17px;margin-right:3px}
.searchbar{
  display:flex;align-items:center;gap:10px;max-width:560px;margin:24px auto 0;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;
}
.searchbar:hover{border-color:var(--accent)}
.searchbar svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}
.searchbar span{color:var(--ink-3);font-size:14px;flex:1;text-align:left}
.searchbar .kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--paper)}

/* 续读条 */
.cont{
  display:none;align-items:center;gap:12px;max-width:820px;margin:22px auto 0;
  background:linear-gradient(120deg,rgba(201,162,39,.12),var(--card) 55%);
  border:1px solid rgba(201,162,39,.4);border-radius:14px;padding:12px 18px;
  font-size:13.5px;box-shadow:var(--shadow);
}
.cont .lab{color:var(--gold);font-weight:800;flex:none}
.cont a{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont a:hover{color:var(--accent)}
.cont .bk{color:var(--ink-3);flex:none;font-size:12.5px}

/* ── 书架 ── */
.shelf{margin:42px 0 0}
.shelf-head{display:flex;align-items:baseline;gap:10px;padding:0 4px 12px}
.shelf-head .gi{font-size:20px}
.shelf-head h2{font-size:19px;font-weight:800;color:var(--ink)}
.shelf-head .cnt{font-size:12px;color:var(--ink-3);background:var(--card);border:1px solid var(--line);padding:2px 11px;border-radius:999px}
.shelf-head .desc{font-size:12.5px;color:var(--ink-3);margin-left:auto;display:none}
@media(min-width:760px){.shelf-head .desc{display:block}}
.board{
  position:relative;border-radius:14px;padding:26px 22px 0;
  background:linear-gradient(180deg,rgba(154,107,67,.10),rgba(154,107,67,.04));
  border:1px solid rgba(154,107,67,.18);border-bottom:none;
  border-radius:14px 14px 0 0;
}
.books{display:flex;flex-wrap:wrap;gap:18px 20px;justify-content:center;align-items:flex-end}
.plank{
  height:14px;margin:0 -22px;border-radius:3px;
  background:linear-gradient(180deg,var(--wood) 0%,var(--wood-2) 55%,var(--wood-3) 100%);
  box-shadow:0 6px 12px -4px rgba(94,61,34,.45), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
}
.plank::after{
  content:"";position:absolute;left:10px;right:10px;bottom:-8px;height:8px;
  background:linear-gradient(180deg,rgba(94,61,34,.30),transparent);border-radius:0 0 8px 8px;
}

/* 书 = 统一开本的布面封面 */
.bkc{
  position:relative;flex:none;width:162px;height:226px;
  border-radius:4px 10px 10px 4px;
  background-color:var(--bc,#3D7A4F);
  background-image:linear-gradient(165deg,color-mix(in srgb,var(--bc),#fff 15%) 0%,color-mix(in srgb,var(--bc),#000 14%) 100%);
  box-shadow:
    inset 7px 0 8px -7px rgba(0,0,0,.5),
    inset -1px 0 0 rgba(255,255,255,.15),
    4px 10px 16px -6px rgba(60,45,20,.42);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:22px 15px 16px 21px;
  transition:transform .2s ease,box-shadow .2s ease;
  cursor:pointer;
}
.bkc::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(255,255,255,.14) 55%,rgba(0,0,0,.10));
}
.bkc::after{
  content:"";position:absolute;right:-3px;top:5px;bottom:5px;width:3px;border-radius:0 2px 2px 0;
  background:repeating-linear-gradient(180deg,#FBF7EC 0 2px,#D9CFBA 2px 3px);
}
.bkc:hover{transform:translateY(-10px);box-shadow:inset 7px 0 8px -7px rgba(0,0,0,.5),8px 18px 26px -6px rgba(60,45,20,.5)}
.bkc .ic{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));flex:none;margin-bottom:12px}
.bkc .ttl{
  color:#fff;font-weight:800;font-size:15px;line-height:1.5;letter-spacing:.03em;
  text-shadow:0 1px 3px rgba(0,0,0,.32);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.bkc .rule{width:26px;height:2px;background:rgba(255,255,255,.5);border-radius:1px;margin:12px auto 0;flex:none}
.bkc .meta{margin-top:auto;color:rgba(255,255,255,.88);font-size:11.5px;letter-spacing:.02em}
.bkc .mini{margin-top:8px;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;flex:none}
.bkc .mini i{display:block;height:100%;background:rgba(255,255,255,.95);border-radius:2px}
.bkc .st{
  position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.26);padding:2px 8px;border-radius:999px;letter-spacing:.06em;
}
.bkc.big{width:236px;height:336px;padding:34px 20px 20px 26px;cursor:default;border-radius:5px 12px 12px 5px}
.bkc.big .ic{font-size:42px;margin-bottom:16px}
.bkc.big .ttl{font-size:20px;-webkit-line-clamp:4}
.bkc.big .rule{width:34px;margin-top:16px}
.bkc.big .meta{font-size:13px;margin-top:auto}
.bkc.big .mini{height:5px;margin-top:10px}
.bkc.big .st{font-size:11px;top:14px;right:14px}
.bkc.big::after{width:4px;right:-4px}

/* ── 书籍详情页 ── */
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:18px;transition:.15s}
.crumb:hover{color:var(--accent)}
.crumb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.bp{display:grid;grid-template-columns:280px 1fr;gap:34px;align-items:start}
@media(max-width:860px){.bp{grid-template-columns:1fr;gap:24px}}
.bp-side{position:sticky;top:82px}
@media(max-width:860px){.bp-side{position:static;display:flex;gap:20px;align-items:flex-start}}
.bp-side .bkc.big{flex:none}
.bp-info{min-width:0;flex:1}
@media(min-width:861px){.bp-info{margin-top:16px}}
.bp-info .desc{font-size:13.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px}
.bp-go{
  display:inline-flex;align-items:center;gap:8px;margin-top:4px;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  padding:11px 22px;border-radius:12px;box-shadow:0 5px 14px -4px rgba(37,90,54,.5);
  transition:.15s;
}
.bp-go:hover{background:var(--accent-2);transform:translateY(-2px)}
.bp-go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.bp-ent{font-size:12.5px;color:var(--ink-3);margin-top:12px;line-height:1.6}
.bp-ent a{color:var(--accent);font-weight:600}
.bp-ent a:hover{text-decoration:underline}
.bp-main{min-width:0}
.part{margin-bottom:26px}
.part-h{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:2px solid var(--line);margin-bottom:6px}
.part-h h3{font-size:15.5px;font-weight:800;color:var(--ink)}
.part-h .pc{font-size:11.5px;color:var(--ink-3)}
.part-h .ps{margin-left:auto;font-size:10.5px;font-weight:800;padding:2px 10px;border-radius:999px}
.ps.done{background:rgba(61,122,79,.14);color:var(--accent)}
.ps.doing{background:rgba(201,162,39,.18);color:#8A6D10}
.ps.plan{background:rgba(138,132,116,.14);color:var(--ink-3)}
.ch{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  font-size:14px;color:var(--ink-2);transition:.13s;border:1px solid transparent;
}
.ch:hover{background:var(--card);border-color:var(--line);color:var(--ink);transform:translateX(3px)}
.ch .n{
  flex:none;width:34px;height:24px;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:var(--accent);background:rgba(61,122,79,.10);
  border-radius:7px;font-variant-numeric:tabular-nums;
}
.ch .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .tag{flex:none;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.deep{background:#F3DBDE;color:#A63D4E}
.tag.std{background:#DDEBD4;color:#3D7A4F}
.tag.basic{background:#F3E8C8;color:#8A6D10}
.ch .rd{flex:none;color:var(--accent);font-size:13px;font-weight:800;opacity:0}
.ch.read .rd{opacity:1}
.ch.read .t{color:var(--ink-3)}
.ch.now{background:rgba(201,162,39,.10);border-color:rgba(201,162,39,.45)}
.ch.now .t{color:var(--ink);font-weight:700}

/* ── 搜索弹层 ── */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(43,42,36,.4);backdrop-filter:blur(5px);
  display:none;align-items:flex-start;justify-content:center;padding:11vh 20px 20px;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:620px;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 70px rgba(40,32,16,.35);border:1px solid var(--line);
}
.modal .ms{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal .ms svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}
.modal .ms input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink)}
.modal .mb{max-height:56vh;overflow-y:auto;padding:8px}
.res{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
.res:hover,.res.on{background:rgba(61,122,79,.09)}
.res .ic{flex:none;font-size:16px;width:22px;text-align:center}
.res .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.res .bk2{flex:none;font-size:11px;color:var(--ink-3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13.5px}
.res-head{font-size:11px;color:var(--ink-3);padding:10px 12px 4px;font-weight:700;letter-spacing:.06em}

.foot{text-align:center;margin-top:70px;color:var(--ink-3);font-size:12.5px}
.foot .line{opacity:.5;margin:0 8px}

@media(max-width:640px){
  main{padding:24px 14px 60px}
  .hero h1{font-size:25px}
  .hero .stats{gap:8px 18px;padding:10px 18px;font-size:12.5px}
  .hero .stats b{font-size:15px}
  .books{gap:14px 12px}
  .bkc{width:140px;height:200px;padding:16px 11px 12px 17px}
  .bkc .ttl{font-size:13px}
  .bkc .ic{font-size:22px;margin-bottom:9px}
  .bkc.big{width:200px;height:290px}
  .topbar-in{padding:0 14px}
  .brand small{display:none}
  .ch{font-size:13px;gap:9px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/"><span class="logo">📚</span>树荫书房<small>教科书级全栈知识库</small></a>
    <div class="sp"></div>
    <button class="tb-btn" id="searchBtn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      搜书 / 搜章节<span class="kbd">/</span>
    </button>
  </div>
</header>

<main id="app"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="ms">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="书名、技术点、章节标题…比如：闭包 / 索引 / 线程池" autocomplete="off">
    </div>
    <div class="mb" id="modalBody"></div>
  </div>
</div>

<noscript><p style="text-align:center;padding:60px 20px">本书房需要启用 JavaScript 才能翻阅书架。</p></noscript>

<script src="./assets/manifest.js"></script>
<script>
const M = window.KB_MANIFEST;
const $ = s => document.querySelector(s);
const app = $('#app');
const PREFIX = 'old-docs/';

const BOOKS = M.books || [];
const BMAP = {}; BOOKS.forEach(b => BMAP[b.key] = b);

/* ───── 已读 / 续读（与文章页外壳共用存储） ───── */
let readSet;
try{ readSet = new Set(JSON.parse(localStorage.getItem('kb_read') || '[]')); }catch(e){ readSet = new Set(); }
function isRead(u){ return readSet.has(u) || readSet.has(u.slice(PREFIX.length)); }
let lastRead = null;
try{ lastRead = JSON.parse(localStorage.getItem('kb_last') || 'null'); }catch(e){}
function lastFullPath(u){ return !u ? '' : (u.startsWith(PREFIX) ? u : PREFIX + u); }

function findLast(){
  const nu = lastFullPath(lastRead && lastRead.u);
  if(!nu) return null;
  for(const b of BOOKS){
    const c = b.chapters.find(c => c.u === nu);
    if(c) return {b, c};
  }
  return null;
}

function bookStat(b){
  const real = b.chapters.filter(c => c.n > 0);
  const done = real.filter(c => isRead(c.u)).length;
  return {real, done, pct: real.length ? Math.round(done / real.length * 100) : 0};
}
function plainName(n){ return n.replace(/[《》]/g, ''); }
function statusInfo(b){
  if(b.status === 'done') return {cls:'', text:'全书完'};
  if(b.status === 'plan') return {cls:'', text:'撰写中'};
  return {cls:'', text:''};
}
function firstReal(b){ const r = b.chapters.filter(c => c.n > 0); return r[0] || b.chapters[0]; }

/* ───── 书架页 ───── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function renderShelf(tabGroup){
  const last = findLast();
  const readTotal = BOOKS.reduce((s,b)=> s + b.chapters.filter(c=>c.n>0 && isRead(c.u)).length, 0);
  let html = `
  <section class="hero">
    <div class="badge">📖 教科书级整理 · 每个技术点，都是一本书</div>
    <h1>把全栈技术，<em>装订</em>成一排排书</h1>
    <p class="sub">树荫下有一间书房：推门进来，按书取读。章章相扣，像翻一本真的书。</p>
    <div class="stats">
      <span><b>${BOOKS.length}</b>本书</span>
      <span><b>${M.total}</b>章</span>
      <span><b>${readTotal}</b>章已读</span>
      <span><b>${M.groups.length}</b>个书架</span>
    </div>
    <div class="searchbar" id="searchTrigger">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>找一本书，或某一章…</span><span class="kbd">/</span>
    </div>
  </section>`;

  if(last){
    html += `
    <div class="cont" style="display:flex">
      <span class="lab">📖 续读</span>
      <a href="${encodeURI(last.c.u)}">${esc(last.c.t)}</a>
      <span class="bk">《${esc(last.b.name)}》</span>
    </div>`;
  }

  html += `<div id="shelves">`;
  (M.groups || []).forEach(g => {
    const gbooks = BOOKS.filter(b => b.group === g.key);
    if(!gbooks.length) return;
    const cnt = gbooks.reduce((s,b)=>s+b.chapters.length,0);
    html += `
    <section class="shelf" id="shelf-${esc(g.key)}">
      <div class="shelf-head">
        <span class="gi">${g.icon}</span><h2>${esc(g.name)}</h2>
        <span class="cnt">${gbooks.length} 本 · ${cnt} 章</span>
        <span class="desc">${shelfDesc(g.key)}</span>
      </div>
      <div class="board"><div class="books">`;
    gbooks.forEach(b => {
      const st = b.entry ? {cls:'', text:'独立站'} : statusInfo(b);
      const s = bookStat(b);
      html += `
        <a class="bkc" style="--bc:${b.color}" href="#/book/${encodeURIComponent(b.key)}" title="${esc(b.name)}">
          ${st.text ? `<span class="st">${st.text}</span>` : ``}
          <span class="ic">${b.icon}</span>
          <span class="ttl">${esc(plainName(b.name))}</span>
          <span class="rule"></span>
          <span class="meta">${b.chapters.length} 章 · 已读 ${s.done}</span>
          <span class="mini"><i style="width:${s.pct}%"></i></span>
        </a>`;
    });
    html += `</div><div class="plank"></div></div></section>`;
  });
  html += `</div>
  <div class="foot">树荫书房 · 慢慢读，自然会<span class="line">|</span>old-docs 为原稿归档</div>`;

  app.innerHTML = html;
  $('#searchTrigger').onclick = openSearch;
  if(tabGroup && GMAP[tabGroup]){
    setTimeout(()=>{ const el = $('#shelf-'+tabGroup); if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); } }, 50);
  }
}
function shelfDesc(g){
  return {tutorial:'从第一行代码到贯通全书的完整学习线',
          fe:'语言、框架、可视化与实时通信',
          server:'后端语言、数据库与数据建模',
          eng:'构建、规范、交付与运维',
          workflow:'研发协作与 AI 提效',
          meta:'体系化精讲与路线总览'}[g] || '';
}

/* ───── 书籍页 ───── */
function partsOf(b){
  const real = b.chapters.filter(c => c.n > 0);
  const toc  = b.chapters.filter(c => c.n === 0);
  if(!b.parts || !b.parts.length) return {toc, groups:[{name:'章节', state:null, rows:real}]};
  let idx = 0; const groups = [];
  b.parts.forEach(p => {
    const rows = real.slice(idx, idx + p.chapters); idx += p.chapters;
    groups.push({name:p.name, state:p.state, rows});
  });
  if(idx < real.length) groups.push({name:'附录与其他', state:null, rows:real.slice(idx)});
  return {toc, groups};
}

function renderBook(key){
  const b = BMAP[key];
  if(!b){ renderShelf(); return; }
  document.title = `${b.name} · 树荫书房`;
  const {toc, groups} = partsOf(b);
  const s = bookStat(b);
  const st = b.entry ? {cls:'', text:'独立站'} : statusInfo(b);
  const last = findLast();
  const nowCh = (last && last.b.key === b.key) ? last.c : null;
  const goTarget = nowCh || firstReal(b);

  let side = `
  <aside class="bp-side">
    <div class="bkc big" style="--bc:${b.color}">
      ${st.text ? `<span class="st">${st.text}</span>` : ``}
      <span class="ic">${b.icon}</span>
      <span class="ttl">${esc(plainName(b.name))}</span>
      <span class="rule"></span>
      <span class="meta">${b.chapters.length} 章 · 已读 ${s.done} · ${s.pct}%</span>
      <span class="mini"><i style="width:${s.pct}%"></i></span>
    </div>
    <div class="bp-info">
      <p class="desc">${esc(b.desc)}</p>
      ${goTarget ? `<a class="bp-go" href="${encodeURI(goTarget.u)}">${nowCh ? '续读本章' : '开始阅读'}<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>` : ``}
      ${b.entry ? `<p class="bp-ent">这本书有独立导览站：<a href="${encodeURI(b.entry)}">打开 ${esc(b.name)} →</a></p>` : ``}
    </div>
  </aside>`;

  let mainHtml = `<div class="bp-main">`;
  toc.forEach(c => {
    mainHtml += chRow(c, b, nowCh, '📖 本书目录');
  });
  groups.forEach(g => {
    if(!g.rows.length) return;
    mainHtml += `
    <div class="part">
      <div class="part-h">
        <h3>${esc(g.name)}</h3>
        <span class="pc">${g.rows.length} 章</span>
        ${g.state ? `<span class="ps ${g.state}">${g.state==='done'?'完稿':g.state==='doing'?'撰写中':'规划中'}</span>` : ``}
      </div>`;
    g.rows.forEach(c => { mainHtml += chRow(c, b, nowCh); });
    mainHtml += `</div>`;
  });
  mainHtml += `</div>`;

  app.innerHTML = `
  <a class="crumb" href="#/"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>返回书架</a>
  <div class="bp">${side}${mainHtml}</div>`;
}
const TAGS = {deep:'深入', std:'标准', basic:'基础'};
function chRow(c, b, nowCh, label){
  const read = isRead(c.u);
  const now = nowCh && nowCh.u === c.u;
  return `
  <a class="ch${read?' read':''}${now?' now':''}" href="${encodeURI(c.u)}">
    <span class="n">${label ? '📖' : (c.n > 0 ? String(c.n).padStart(2,'0') : '·')}</span>
    <span class="t">${esc(label || c.t)}</span>
    ${TAGS[c.d] ? `<span class="tag ${c.d}">${TAGS[c.d]}</span>` : ``}
    <span class="rd">✓</span>
  </a>`;
}

/* ───── 搜索 ───── */
const overlay = $('#overlay'), mInput = $('#searchInput'), mBody = $('#modalBody');
let resList = [], resIdx = -1;
function openSearch(){ overlay.classList.add('show'); mInput.value=''; renderRes(''); mInput.focus(); }
function closeSearch(){ overlay.classList.remove('show'); }
function renderRes(q){
  q = q.trim().toLowerCase();
  if(!q){ mBody.innerHTML = `<div class="res-empty">输入书名或章节关键词，回车直达</div>`; resList=[]; return; }
  const hits = [];
  BOOKS.filter(b => (b.name + b.desc).toLowerCase().includes(q)).slice(0, 5)
    .forEach(b => hits.push({go: '#/book/' + encodeURIComponent(b.key), ic: b.icon, tt: b.name, bk: b.chapters.length + ' 章'}));
  outer: for(const b of BOOKS){
    for(const c of b.chapters){
      if(c.t.toLowerCase().includes(q)){
        hits.push({go: encodeURI(c.u), ic: c.n > 0 ? String(c.n) : '📖', tt: c.t, bk: '《' + b.name + '》'});
        if(hits.length >= 31) break outer;
      }
    }
  }
  let html = '';
  if(!hits.length){
    html = `<div class="res-empty">没有找到「${esc(q)}」相关的书或章节</div>`;
  } else {
    html += `<div class="res-head">书</div>`;
    hits.slice(0, 5).forEach(h => html += resRow(h));
    if(hits.length > 5){
      html += `<div class="res-head">章节</div>`;
      hits.slice(5).forEach(h => html += resRow(h));
    }
  }
  mBody.innerHTML = html;
  resList = mBody.querySelectorAll('.res');
  resIdx = -1;
  resList.forEach(el => { el.onclick = () => go(el.dataset.go); });
}
function resRow(h){
  return `<div class="res" data-go="${esc(h.go)}"><span class="ic">${esc(h.ic)}</span><span class="tt">${esc(h.tt)}</span><span class="bk2">${esc(h.bk)}</span></div>`;
}
function go(href){
  closeSearch();
  if(href.startsWith('#')){ location.hash = href; }
  else location.href = href;
}

$('#searchBtn').onclick = openSearch;
mInput.addEventListener('input', () => renderRes(mInput.value));
mInput.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!resList.length) return;
    resIdx = (resIdx + (e.key === 'ArrowDown' ? 1 : -1) + resList.length) % resList.length;
    resList.forEach((el,i)=>el.classList.toggle('on', i===resIdx));
    resList[resIdx].scrollIntoView({block:'nearest'});
  } else if(e.key === 'Enter'){
    const el = resList[resIdx] || resList[0];
    if(el) go(el.dataset.go);
  }
});
overlay.addEventListener('click', e => { if(e.target === overlay) closeSearch(); });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(e.key === 'Escape') closeSearch();
  if(e.key === '/' && tag !== 'input' && tag !== 'textarea'){ e.preventDefault(); openSearch(); }
});

/* ───── 路由 ───── */
function route(){
  const h = location.hash || '#/';
  if(h.startsWith('#/book/')){ renderBook(decodeURIComponent(h.slice(7))); }
  else if(h.startsWith('#cat-')){ location.replace('#/book/' + encodeURIComponent(h.slice(5))); return; }
  else { document.title = '树荫书房 · 教科书级全栈知识库'; renderShelf(h.startsWith('#tab-') ? h.slice(5) : null); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
