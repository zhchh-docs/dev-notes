<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C5DDB0">
<title>树荫下的笔记 · 全栈技术知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%233D7A4F'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='white'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#2A3D2A;
  --ink-2:#4F6348;
  --ink-3:#7A8A70;
  --forest:#3D7A4F;
  --forest-deep:#255A36;
  --sun:#F2D06B;
  --card:#F8FAF0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#DCE8D0 0%,#C5DDB0 50%,#B5D0A5 100%);
  color:var(--ink);line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;position:relative;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(61,122,79,.25)}

/* 阳光光斑 */
.sun{
  position:fixed;top:-100px;right:-100px;z-index:0;pointer-events:none;
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,245,180,.5),transparent 70%);
  animation:sunmove 8s ease-in-out infinite alternate;
}
@keyframes sunmove{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-30px,20px) scale(1.1)}
}

/* 顶部树冠 */
.branch{position:fixed;top:0;left:0;width:100%;z-index:1;pointer-events:none;opacity:.85}
.branch svg{display:block;width:100%;height:auto}

/* 飘落叶子 */
.fall{position:fixed;z-index:1;pointer-events:none;animation:fall linear infinite;opacity:.7}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg)}
  100%{transform:translateY(110vh) rotate(360deg)}
}
.f1{left:8%;animation-duration:14s;animation-delay:0s;font-size:18px}
.f2{left:28%;animation-duration:18s;animation-delay:3s;font-size:14px}
.f3{left:55%;animation-duration:16s;animation-delay:6s;font-size:20px}
.f4{left:82%;animation-duration:20s;animation-delay:2s;font-size:13px}
.f5{left:42%;animation-duration:22s;animation-delay:8s;font-size:16px}

/* 顶栏 */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(220,232,208,.7);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.4);
}
.topbar-in{max-width:780px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--forest-deep)}
.brand .logo{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#6BA070,#3D7A4F);
  display:grid;place-items:center;font-size:17px;
  box-shadow:0 4px 12px rgba(61,122,79,.35);
}
.topbar .spacer{flex:1}
.weather{
  font-size:12.5px;color:var(--forest-deep);
  background:rgba(255,255,255,.5);padding:5px 12px;border-radius:999px;
}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--forest-deep);transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.5)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 主区 */
main{max-width:780px;margin:0 auto;padding:80px 20px 60px;position:relative;z-index:2}

/* Hero */
.hero{margin-bottom:24px}
.hero .greeting{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--forest-deep);
  background:rgba(255,255,255,.6);backdrop-filter:blur(6px);
  padding:6px 16px;border-radius:999px;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.7);
}
.hero h1{
  font-size:32px;font-weight:800;letter-spacing:-.01em;line-height:1.25;
  margin-bottom:10px;color:var(--forest-deep);
}
.hero h1 .hl{
  background:linear-gradient(120deg,var(--forest),#7BC47F);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{font-size:14.5px;color:var(--ink-2);max-width:480px}

/* 搜索框 */
.search{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:16px;padding:13px 18px;margin:20px 0;
  box-shadow:0 4px 20px rgba(61,122,79,.12);
  cursor:text;
}
.search svg{width:18px;height:18px;stroke:var(--forest);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:none;background:none;outline:none;font-size:14.5px;color:var(--ink);cursor:text}
.search input::placeholder{color:var(--ink-3)}
.search .kbd{font-size:11px;color:var(--ink-3);background:#DCE8D0;padding:3px 8px;border-radius:6px;font-family:ui-monospace,monospace}

/* 深度筛选 */
.toolbar{display:flex;align-items:center;gap:8px;margin:4px 0 28px;flex-wrap:wrap}
.pill{
  font-size:12.5px;padding:5px 14px;border-radius:999px;
  background:rgba(255,255,255,.5);color:var(--ink-2);
  transition:.15s;cursor:pointer;border:1px solid transparent;
}
.pill:hover{background:rgba(255,255,255,.8)}
.pill.on{background:var(--forest);color:#fff;font-weight:500}

/* 继续读 */
.cont-bar{
  display:none;align-items:center;gap:10px;margin:0 0 18px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.9);border-radius:14px;
  padding:11px 16px;box-shadow:0 4px 16px rgba(61,122,79,.12);
  font-size:13.5px;
}
.cont-bar .cont-label{color:var(--forest-deep);font-weight:600;flex:none}
.cont-bar a{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont-bar a:hover{color:var(--forest)}

/* 学习路径 */
.route-wrap{margin:0 0 30px}
.route-title{font-size:13px;color:var(--forest-deep);font-weight:700;margin-bottom:10px;letter-spacing:.02em}
.route{display:flex;flex-wrap:wrap;gap:8px}
.route-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--ink-2);
  background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);
  border-radius:999px;padding:5px 13px 5px 6px;cursor:pointer;transition:.15s;
}
.route-chip:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(61,122,79,.15)}
.route-chip em{
  font-style:normal;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  background:linear-gradient(135deg,#6BA070,#3D7A4F);color:#fff;
}

/* 贴纸墙 */
.wall{display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:680px){.wall{grid-template-columns:1fr 1fr;gap:30px}}

.sticky{
  position:relative;padding:22px 20px 18px;
  clip-path:polygon(0 3%,3% 0,97% 2%,100% 5%,98% 97%,95% 100%,3% 98%,0 95%);
  box-shadow:2px 4px 14px rgba(61,122,79,.15);
  transition:transform .2s, box-shadow .2s;
}
.sticky:hover{transform:rotate(0deg) scale(1.02) !important;z-index:5;box-shadow:4px 8px 24px rgba(61,122,79,.2)}
.sticky.flash{animation:catflash 1.2s ease-in-out 2}
@keyframes catflash{
  0%,100%{box-shadow:2px 4px 14px rgba(61,122,79,.15)}
  50%{box-shadow:0 0 0 4px var(--forest),4px 8px 24px rgba(61,122,79,.35)}
}
.sticky::before{
  content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:80px;height:22px;
  background:rgba(255,251,230,.7);
  border-left:1px dashed rgba(0,0,0,.08);
  border-right:1px dashed rgba(0,0,0,.08);
}

/* 6种贴纸颜色循环 */
.s0{background:#FFF8E7;transform:rotate(-1.2deg)}
.s1{background:#E8F4E0;transform:rotate(1deg)}
.s2{background:#FDE8E8;transform:rotate(.8deg)}
.s3{background:#E8E8F8;transform:rotate(-.8deg)}
.s4{background:#FFF0D8;transform:rotate(1.2deg)}
.s5{background:#E0F0F5;transform:rotate(-1deg)}
.s6{background:#F0E8F0;transform:rotate(.6deg)}

.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cat-ic{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.7);
}
.cat-head h3{font-size:16px;font-weight:700;color:var(--forest-deep)}
.cnt{font-size:11px;color:var(--ink-3);margin-left:auto}
.desc{font-size:12.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.5}
.arts{list-style:none}
.arts li{
  font-size:13.5px;color:var(--ink-2);padding:5px 0;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px dashed rgba(0,0,0,.06);
  cursor:pointer;transition:.12s;
}
.arts li:last-child{border-bottom:none}
.arts li.read{opacity:.55}
.arts li.read .t{color:var(--forest)}
.more-btn{padding:7px 0 2px;font-size:12px;color:var(--forest);cursor:pointer;font-weight:600}
.more-btn:hover{text-decoration:underline}
.prog{height:4px;border-radius:2px;background:rgba(0,0,0,.07);margin:0 0 10px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#6BA070,#3D7A4F);transition:width .4s}
.arts li:hover{color:var(--ink);padding-left:4px}
.arts li .dot{width:6px;height:6px;border-radius:50%;flex:none}
.arts li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arts li .tag{font-size:10.5px;padding:1px 7px;border-radius:999px;flex:none}
.tag.deep{background:#E8A0A8;color:#fff}
.tag.std{background:#9CC48E;color:var(--forest-deep)}
.tag.basic{background:var(--sun);color:#7a5a20}

/* 不同贴纸的圆点色 */
.s0 .dot{background:#8B6F47}
.s1 .dot{background:#5A9E6A}
.s2 .dot{background:#C97888}
.s3 .dot{background:#8878B0}
.s4 .dot{background:#D4A050}
.s5 .dot{background:#5A9AB5}
.s6 .dot{background:#B07890}

/* 搜索模态 */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(37,90,54,.35);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;
  padding:12vh 20px 20px;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:600px;background:var(--card);
  border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden;
  border:1px solid rgba(255,255,255,.8);
}
.modal-search{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06)}
.modal-search svg{width:18px;height:18px;stroke:var(--forest);fill:none;stroke-width:2;flex:none}
.modal-search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink)}
.modal-body{max-height:55vh;overflow-y:auto;padding:6px}
.res-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;cursor:pointer;font-size:13.5px;
}
.res-item.active{background:rgba(156,196,142,.25)}
.res-item .ic{font-size:15px;flex:none}
.res-item .meta{margin-left:auto;font-size:11px;color:var(--ink-3);flex:none}
.res-empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13.5px}

.foot{
  text-align:center;margin-top:48px;color:var(--forest-deep);font-size:13px;
  opacity:.8;
}

@media(max-width:640px){
  .hero h1{font-size:26px}
  .topbar-in{padding:0 16px}
  main{padding:76px 16px 50px}
}
</style>
</head>
<body>

<div class="sun"></div>

<div class="branch">
  <svg viewBox="0 0 1200 180" preserveAspectRatio="none">
    <path d="M0,0 Q200,40 400,20 T800,30 T1200,10 L1200,0 Z" fill="#3D7A4F" opacity=".3"/>
    <g fill="#4A8B5A" opacity=".7">
      <ellipse cx="80" cy="30" rx="25" ry="12"/>
      <ellipse cx="180" cy="15" rx="30" ry="14"/>
      <ellipse cx="320" cy="35" rx="28" ry="13"/>
      <ellipse cx="480" cy="18" rx="26" ry="12"/>
      <ellipse cx="650" cy="30" rx="32" ry="14"/>
      <ellipse cx="820" cy="15" rx="28" ry="13"/>
      <ellipse cx="980" cy="28" rx="30" ry="14"/>
      <ellipse cx="1120" cy="18" rx="26" ry="12"/>
    </g>
    <g fill="#6BA070" opacity=".6">
      <ellipse cx="130" cy="45" rx="18" ry="9"/>
      <ellipse cx="400" cy="48" rx="20" ry="10"/>
      <ellipse cx="750" cy="45" rx="22" ry="10"/>
      <ellipse cx="1050" cy="45" rx="18" ry="9"/>
    </g>
  </svg>
</div>

<div class="fall f1">🍃</div>
<div class="fall f2">🍂</div>
<div class="fall f3">🌿</div>
<div class="fall f4">🍃</div>
<div class="fall f5">🍂</div>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="./">
      <span class="logo">🌳</span>
      <span>树荫下的笔记</span>
    </a>
    <div class="spacer"></div>
    <div class="weather">☀️ 光斑摇曳</div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="greeting">🌿 坐在大树下 · 风很轻 · 慢慢读</div>
    <h1>在<span class="hl">树荫下</span><br>翻完这 <span id="totalN">99</span> 篇笔记</h1>
    <p>头顶是树叶缝里漏下来的阳光，手里是一杯热茶。技术不用赶，一篇一篇来就好。</p>

    <div class="search" id="searchTrigger">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="在林子里找一篇… 比如：闭包、Redis、Docker" autocomplete="off">
      <span class="kbd">⌘K</span>
    </div>

    <div class="toolbar">
      <button class="pill on" data-d="all">全部</button>
      <button class="pill" data-d="deep">🌊 深入</button>
      <button class="pill" data-d="std">🌿 标准</button>
      <button class="pill" data-d="basic">🌱 入门</button>
    </div>
  </section>

  <div id="contBar" class="cont-bar">
    <span class="cont-label">📖 上次读到</span>
  </div>

  <div class="route-wrap">
    <div class="route-title">🧭 学习路径 · 按顺序走一遍</div>
    <div class="route" id="route"></div>
  </div>

  <div class="wall" id="wall"></div>

  <div class="foot">🌳 树荫下笔记 · 慢慢读，自然会</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="modalInput" type="text" placeholder="搜索文章标题、技术点…" autocomplete="off">
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="./assets/manifest.js"></script>
<script>
const M = window.KB_MANIFEST;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let total = 0;
M.cats.forEach(c => total += c.arts.length);
$('#totalN').textContent = total;

/* 已读记录 */
let readSet;
try{ readSet = new Set(JSON.parse(localStorage.getItem('kb_read') || '[]')); }
catch(e){ readSet = new Set(); }

/* 学习路径条 */
const route = $('#route');
M.cats.forEach((cat, idx) => {
  const a = document.createElement('a');
  a.className = 'route-chip';
  a.href = '#cat-' + encodeURIComponent(cat.key);
  a.innerHTML = `<em>${idx+1}</em>${cat.icon} ${cat.name}`;
  a.onclick = e => { e.preventDefault(); scrollToCat(cat.key, false); };
  route.appendChild(a);
});

/* 继续阅读 */
(function(){
  let last = null;
  try{ last = JSON.parse(localStorage.getItem('kb_last') || 'null'); }catch(e){}
  if(!last || !last.u) return;
  let hit = null;
  M.cats.forEach(c => c.arts.forEach(a => { if(a.u === last.u) hit = a; }));
  if(!hit) return;
  const bar = $('#contBar');
  bar.innerHTML = `<span class="cont-label">📖 上次读到</span><a href="${encodeURI(hit.u)}">${hit.t}</a>`;
  bar.style.display = 'flex';
})();

function scrollToCat(key, flash = true){
  const el = wall.querySelector(`[data-cat="${key}"]`);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  if(flash){
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 2400);
  }
}

/* 渲染贴纸墙 */
const wall = $('#wall');
let curDepth = 'all';
function render(){
  wall.innerHTML = '';
  M.cats.forEach((cat, idx) => {
    const arts = cat.arts.filter(a => curDepth === 'all' || a.d === curDepth);
    if(!arts.length) return;
    const n = idx % 7;
    const readCnt = cat.arts.filter(a => readSet.has(a.u)).length;
    const card = document.createElement('div');
    card.className = 'sticky s' + n;
    card.dataset.cat = cat.key;
    card.innerHTML = `
      <div class="cat-head">
        <div class="cat-ic">${cat.icon}</div>
        <h3>${cat.name}</h3>
        <span class="cnt">${readCnt > 0 ? '已读 ' + readCnt + '/' : ''}${arts.length} 篇</span>
      </div>
      <div class="desc">${cat.desc}</div>
      <div class="prog"><i style="width:${arts.length ? Math.round(readCnt/arts.length*100) : 0}%"></i></div>
      <ul class="arts"></ul>`;
    const list = card.querySelector('.arts');
    function makeLi(a){
      const li = document.createElement('li');
      const read = readSet.has(a.u);
      li.innerHTML = `<span class="dot"></span><span class="t">${read ? '✓ ' : ''}${a.t}</span><span class="tag ${a.d}">${a.d==='deep'?'深入':a.d==='std'?'标准':'入门'}</span>`;
      if(read) li.classList.add('read');
      li.onclick = () => location.href = encodeURI(a.u);
      return li;
    }
    arts.slice(0, 5).forEach(a => list.appendChild(makeLi(a)));
    if(arts.length > 5){
      const more = document.createElement('div');
      more.className = 'more-btn';
      more.textContent = `展开其余 ${arts.length - 5} 篇 ▾`;
      more.onclick = () => {
        arts.slice(5).forEach(a => list.appendChild(makeLi(a)));
        more.remove();
      };
      list.appendChild(more);
    }
    wall.appendChild(card);
  });
}
render();

/* 从文章页顶栏点分类名跳回：定位到对应模块并高亮 */
(function(){
  const hash = decodeURIComponent(location.hash || '');
  if(!hash.startsWith('#cat-')) return;
  setTimeout(() => scrollToCat(hash.slice(5)), 150);
})();

$$('.pill').forEach(p => {
  p.onclick = () => {
    $$('.pill').forEach(x => x.classList.remove('on'));
    p.classList.add('on');
    curDepth = p.dataset.d;
    render();
  };
});

/* 搜索模态 */
const overlay = $('#overlay');
const modalInput = $('#modalInput');
const modalBody = $('#modalBody');
let flat = [];
M.cats.forEach(c => c.arts.forEach(a => flat.push({...a, catName: c.name, catIcon: c.icon})));
let results = [];
let activeIdx = 0;

function openModal(val=''){
  overlay.classList.add('show');
  modalInput.value = val;
  setTimeout(()=>modalInput.focus(), 50);
  doSearch(val);
}
function closeModal(){ overlay.classList.remove('show'); }
function doSearch(q){
  q = q.trim().toLowerCase();
  results = q ? flat.filter(a => a.t.toLowerCase().includes(q) || a.catName.toLowerCase().includes(q)) : flat.slice(0,12);
  activeIdx = 0;
  renderResults();
}
function renderResults(){
  modalBody.innerHTML = '';
  if(!results.length){ modalBody.innerHTML = '<div class="res-empty">没有找到匹配的文章 🌱</div>'; return; }
  results.slice(0,50).forEach((a,i) => {
    const div = document.createElement('div');
    div.className = 'res-item' + (i===activeIdx?' active':'');
    div.dataset.idx = i;
    div.innerHTML = `<span class="ic">${a.catIcon}</span><span>${a.t}</span><span class="meta">${a.catName}</span>`;
    modalBody.appendChild(div);
  });
}
modalBody.addEventListener('mouseover', e => {
  const it = e.target.closest('.res-item');
  if(!it) return;
  const i = +it.dataset.idx;
  if(i === activeIdx) return;
  activeIdx = i;
  modalBody.querySelectorAll('.res-item').forEach((el,j)=>el.classList.toggle('active', j===i));
});
modalBody.addEventListener('click', e => {
  const it = e.target.closest('.res-item');
  if(!it) return;
  const a = results[+it.dataset.idx];
  if(a) location.href = encodeURI(a.u);
});
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });

$('#searchTrigger').addEventListener('click', () => openModal());
$('#searchInput').addEventListener('focus', () => { openModal(); });
modalInput.addEventListener('input', e => doSearch(e.target.value));

document.addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    overlay.classList.contains('show') ? closeModal() : openModal();
  }
  if(e.key==='Escape' && overlay.classList.contains('show')) closeModal();
  if(overlay.classList.contains('show')){
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(results.length-1,activeIdx+1); renderResults(); modalBody.children[activeIdx]?.scrollIntoView({block:'nearest'}); }
    if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(0,activeIdx-1); renderResults(); modalBody.children[activeIdx]?.scrollIntoView({block:'nearest'}); }
    if(e.key==='Enter'){ e.preventDefault(); const a=results[activeIdx]; if(a) location.href=encodeURI(a.u); }
  }
});
</script>
</body>
</html>
